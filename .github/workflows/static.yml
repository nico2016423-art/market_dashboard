name: Deploy static content to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: '50 22 * * 1-5'
  workflow_run:
    workflows: ["Refresh dashboard data"]
    types: [completed]
    branches: ["main"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install daily model dependencies
        run: python -m pip install yfinance pandas numpy
      - name: Generate SRM daily data and prepare list interface
        run: python scripts/build_srm.py
        env:
          TZ: UTC
      - name: Generate macro snapshot and retain simple overview
        run: python scripts/build_macro.py
        env:
          TZ: UTC
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
