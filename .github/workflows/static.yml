name: Deploy static content to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh dashboard data"]
    types: [completed]
    branches: ["main"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Check saved snapshot readiness
        id: snapshots
        run: |
          if test -s data/srm.json && test -s data/macro.json; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No saved snapshots yet. Waiting for Refresh dashboard data; existing live site is unchanged." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Set up Python for local file preparation only
        if: steps.snapshots.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare site without downloading market data
        if: steps.snapshots.outputs.ready == 'true'
        run: python scripts/prepare_site.py --version "$(git rev-parse --short HEAD)"
      - name: Setup Pages
        if: steps.snapshots.outputs.ready == 'true'
        uses: actions/configure-pages@v5
      - name: Upload artifact
        if: steps.snapshots.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        if: steps.snapshots.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
