name: Refresh dashboard data
on:
  schedule:
    - cron: '50 22 * * 1-5'
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'scripts/build_watchlist.py'
      - 'scripts/build_data.py'
      - 'data/watchlist.txt'
      - 'data/labels_zh.json'
      - '.github/workflows/refresh_data.yml'
permissions:
  contents: write
concurrency:
  group: market-data-refresh
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install yfinance pandas numpy
      - name: Build validated simple watchlist
        run: python scripts/build_watchlist.py
      - name: Save snapshot only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/watchlist.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: refresh simple watchlist snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
