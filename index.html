function multiChart(g){multiGroup=g;if(chartWidget){chartWidget.remove();chartWidget=null;}$('single-chart-panel').style.display='none';$('multi-chart-panel').style.display='block';$('chart-mode').textContent=label(g)+' · 多圖模式（目前搜尋結果）';updateButtons();buildMulti();}

function filterRows(){var q=$('search').value.trim().toUpperCase(),shown=0,total=0;document.querySelectorAll('.group-container').forEach(function(section){var count=0;section.querySelectorAll('.ticker-row').forEach(function(row){total++;row.hidden=!row.dataset.symbol.toUpperCase().includes(q);if(!row.hidden){count++;shown++;}});section.hidden=count===0;section.querySelector('.group-count').textContent=count+' 檔';document.querySelectorAll('[data-jump]').forEach(function(b){if(b.dataset.jump===section.dataset.group)b.hidden=count===0;});});$('result-count').textContent='顯示 '+shown+' / '+total+' 筆分類項目';$('no-results').hidden=!snapshot||shown!==0;if(multiGroup!==null)buildMulti();}
function sortTable(table,key){var group=table.dataset.group,state=sortStates[group]||{key:null,count:0};state.count=state.key===key?(state.count+1)%3:1;state.key=state.count?key:null;sortStates[group]=state;var dir=state.count===2?-1:1,rows=Array.from(table.tBodies[0].rows);var sectorOrder=meta.SECTOR_ORDER||[],map=meta.TICKER_TO_SECTOR||{};function sectorIndex(t){var i=sectorOrder.indexOf(map[t]||'Unknown');return i<0?sectorOrder.length:i;}rows.sort(function(a,b){if(!state.count)return Number(a.dataset.index)-Number(b.dataset.index);var av=a.getAttribute('data-'+key),bv=b.getAttribute('data-'+key);if(key==='symbol'){if(group==='Industries'){var d=sectorIndex(av)-sectorIndex(bv);if(d)return d*dir;}return av.toLowerCase().localeCompare(bv.toLowerCase())*dir;}if(key==='abc')return av.localeCompare(bv)*dir;if(!num(av)||av==='')return !num(bv)||bv===''?0:1;if(!num(bv)||bv==='')return -1;return (Number(av)-Number(bv))*dir;});rows.forEach(function(r){table.tBodies[0].append(r);});table.querySelectorAll('th,td').forEach(function(e){e.classList.remove('sorted-column','sort-asc','sort-desc');e.removeAttribute('aria-sort');});if(state.count){columns.forEach(function(c,i){if(c[0]!==key)return;var h=table.tHead.rows[0].cells[i];h.classList.add('sorted-column',dir===1?'sort-asc':'sort-desc');h.setAttribute('aria-sort',dir===1?'ascending':'descending');rows.forEach(function(r){r.cells[i].classList.add('sorted-column');});});}if(multiGroup===group)buildMulti();}
$('groups-container').addEventListener('click',function(e){var sort=e.target.closest('[data-sort]');if(sort){sortTable(sort.closest('table'),sort.dataset.sort);return;}var multi=e.target.closest('[data-multi]');if(multi){if(multiGroup===multi.dataset.multi)singleChart();else multiChart(multi.dataset.multi);return;}var etf=e.target.closest('[data-etf]');if(etf){selectSymbol(etf.dataset.etf);return;}var row=e.target.closest('.ticker-row');if(row)selectSymbol(row.dataset.symbol,row);});
$('category-nav').addEventListener('click',function(e){var b=e.target.closest('[data-jump]');if(b){var section=$(gid(b.dataset.jump));if(section)section.scrollIntoView({behavior:'smooth',block:'start'});}});
var searchTimer;$('search').addEventListener('input',function(){clearTimeout(searchTimer);searchTimer=setTimeout(filterRows,220);});$('clear-search').onclick=function(){clearTimeout(searchTimer);$('search').value='';filterRows();$('search').focus();};$('single-mode').onclick=singleChart;
function closeCalendar(){$('economic-calendar-modal-overlay').style.display='none';$('calendar-open').focus();}
$('calendar-open').onclick=function(){$('economic-calendar-modal-overlay').style.display='flex';$('calendar-close').focus();if(!calendarReady){calendarReady=true;var w=$('calendar-widget');w.innerHTML='<div class="tradingview-widget-container__widget"></div>';var s=document.createElement('script');s.src='https://s3.tradingview.com/external-embedding/embed-widget-events.js';s.async=true;s.textContent=JSON.stringify({colorTheme:'dark',isTransparent:false,locale:'zh_TW',countryFilter:'us',importanceFilter:'-1,0,1',width:'100%',height:550});w.append(s);}};$('calendar-close').onclick=closeCalendar;$('economic-calendar-modal-overlay').onclick=function(e){if(e.target===this)closeCalendar();};
document.addEventListener('keydown',function(e){var modal=$('economic-calendar-modal-overlay');if(modal.style.display==='flex'){if(e.key==='Escape'){e.preventDefault();closeCalendar();}if(e.key==='Tab'){var items=Array.from(modal.querySelectorAll('button,a[href]'));var first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}if(e.target.closest('input,textarea,select,button,a,summary,[contenteditable="true"],#splitter'))return;if(e.key!=='ArrowDown'&&e.key!=='ArrowUp')return;var rows=visibleRows();if(!rows.length)return;e.preventDefault();var i=rows.indexOf(activeRow);i=i<0?0:Math.max(0,Math.min(rows.length-1,i+(e.key==='ArrowDown'?1:-1)));selectSymbol(rows[i].dataset.symbol,rows[i]);});
var split=$('splitter'),list=document.querySelector('.ticker-list');function setWidth(w){var max=Math.max(380,window.innerWidth-370);w=Math.round(Math.max(380,Math.min(max,w)));document.documentElement.style.setProperty('--left',w+'px');split.setAttribute('aria-valuenow',w);split.setAttribute('aria-valuemax',max);}
split.addEventListener('pointerdown',function(e){if(e.button!==0)return;e.preventDefault();split.setPointerCapture(e.pointerId);document.body.classList.add('resizing');});split.addEventListener('pointermove',function(e){if(document.body.classList.contains('resizing'))setWidth(e.clientX);});function stopResize(){document.body.classList.remove('resizing');}split.addEventListener('pointerup',stopResize);split.addEventListener('pointercancel',stopResize);split.addEventListener('lostpointercapture',stopResize);split.addEventListener('keydown',function(e){if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();setWidth(list.getBoundingClientRect().width+(e.key==='ArrowRight'?30:-30));}});window.addEventListener('resize',function(){if(window.innerWidth>1050)setWidth(list.getBoundingClientRect().width);});if(window.innerWidth>1050)setWidth(list.getBoundingClientRect().width);
async function jsonFile(path){var controller=new AbortController(),timer=setTimeout(function(){controller.abort();},15000);try{var res=await fetch(path,{signal:controller.signal,cache:'no-cache'});if(!res.ok)throw new Error('HTTP '+res.status);return await res.json();}finally{clearTimeout(timer);}}
async function loadData(){$('status').textContent='正在載入數據……';try{var results=await Promise.all([jsonFile('data/snapshot.json'),jsonFile('data/meta.json').catch(function(){return {};})]);snapshot=results[0];meta=results[1]||{};if(!snapshot||!snapshot.groups||typeof snapshot.groups!=='object'||!Object.values(snapshot.groups).some(function(r){return Array.isArray(r)&&r.length;}))throw new Error('缺少分類數據');render();$('status').textContent='數據已載入 · 每日快照，非即時行情';}catch(e){snapshot=null;$('status').textContent='數據載入失敗';$('result-count').textContent='暫無可用數據';$('groups-container').innerHTML='<div class="loading-msg error">未能讀取儀表盤數據。請稍後重試；若持續失敗，請檢查 GitHub Actions 更新結果。<br><button type="button" id="retry-load">重新載入</button></div>';$('retry-load').onclick=loadData;}}
loadData();
