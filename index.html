(--muted)}.table-scroll{overflow-x:auto}.ticker-table{border-collapse:collapse;width:100%;min-width:790px;font-size:12px;table-layout:fixed;font-variant-numeric:tabular-nums}.ticker-table th,.ticker-table td{padding:7px 5px;border-bottom:1px solid #2a3444;text-align:right;white-space:nowrap}.ticker-table th{background:#202b3d;color:#c9d7ef;font-size:11px}.ticker-table th button{background:transparent;color:inherit;border:0;padding:3px 0;font:inherit}.ticker-row{cursor:pointer}.ticker-row:hover{background:#222e40}.ticker-row.active{background:#2b3b54;box-shadow:inset 3px 0 #80b7ff}.ticker-label{padding:3px 6px;border-radius:5px;background:#34425a;color:#fff;display:inline-block}.price-up{color:#4adea5!important}.price-down{color:#fb8585!important}.etf-link{border:0;background:transparent;padding:2px;font-size:10px;text-decoration:underline}.long-etf{color:#6ce5a2}.short-etf{color:#fb9292}.key-hint{padding:7px 10px;border-top:1px solid var(--line);font-size:10px;line-height:1.5;color:var(--muted)}.loading-msg{padding:25px 12px;text-align:center;color:var(--muted);line-height:1.7}.error{color:#ffaaa5}.econ-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:9999;padding:12px}.econ-modal{width:440px;max-width:100%;max-height:95dvh;overflow:auto;background:#111827;border:1px solid #4a5568;border-radius:9px;padding:10px}.econ-modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.econ-modal-close{font-size:20px;padding:0 8px}#calendar-widget{height:550px;width:100%}.tradingview-widget-copyright{font-size:11px;padding-top:5px}#recovery-notice{padding:8px 14px;background:#352d1c;color:#f4dba9;font-size:12px;line-height:1.6;border-bottom:1px solid #6c5730;max-height:20vh;overflow:auto}[hidden],#splitter,#chart-compatibility,[data-multi]{display:none!important}::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#44546c;border-radius:4px}@ <header><div><h1>APEX 市場儀表盤</h1><div class="subtitle">市場概覽 · 板塊輪動 · 主題觀察 · 圖表使用外部TradingView</div></div><div id="status" role="status">正在讀取資料……</div><div id="site-version">版本 R2 · 全寬清單／外部圖表</div></header>
<div id="recovery-notice" role="status">介面不再等待行情計算；正在檢查可用快照。</div>
<main class="workspace"><aside class="ticker-list" aria-label="分類股票清單"><div class="list-tools"><div class="search-line"><input id="search" type="search" placeholder="搜尋代號／中文，例如 XSD、半導體" aria-label="搜尋代號或中文描述" autocomplete="off"><button id="clear-search" type="button">清除</button></div><div id="result-count" aria-live="polite">等待資料</div><nav id="category-nav" aria-label="分類快捷導覽"></nav><div class="utility-row"><button id="calendar-open" type="button">經濟日曆</button><details class="guide"><summary>欄位說明</summary><dl id="column-guide"></dl></details></div><p class="subtitle">網頁不再載入股票圖表。外部連動請使用APEX TradingView Link擴充功能，先在TradingView圖表分頁設定目標。</p></div><div class="groups-scroll" id="groups-scroll"><div id="groups-container"><div class="loading-msg">正在讀取清單……</div></div><div id="no-results" class="loading-msg" hidden>找不到符合的代號。</div></div><div class="key-hint">清單為快照資料；外部圖表使用TradingView。</div></aside></main>

<div id="chart-compatibility" hidden aria-hidden="true"><div id="splitter"></div><span id="selected-symbol"></span><span id="chart-mode"></span><a id="tv-open"></a><button id="single-mode" type="button" hidden></button><div id="single-chart-panel"><div id="tradingview-chart"></div></div><div id="multi-chart-panel"></div></div>
