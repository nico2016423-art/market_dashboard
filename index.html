<main class="workspace">
<aside class="ticker-list" aria-label="分類股票清單"><div class="list-tools"><div class="search-line"><input id="search" type="search" placeholder="搜尋代號／中文，例如 XSD、半導體" aria-label="搜尋代號或中文描述" autocomplete="off"><button id="clear-search" type="button">清除</button></div><div id="result-count" aria-live="polite">等待資料</div><nav id="category-nav" aria-label="分類快捷導覽"></nav><div class="utility-row"><button id="calendar-open" type="button">經濟日曆</button><details class="guide"><summary>欄位說明</summary><dl id="column-guide"></dl></details></div></div><div class="groups-scroll" id="groups-scroll"><div id="groups-container"><div class="loading-msg">正在讀取清單……</div></div><div id="no-results" class="loading-msg" hidden>找不到符合的代號。</div></div><div class="key-hint">清單行情與圖表可能不同批次；以資料提示為準。</div></aside>
